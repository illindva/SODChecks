{% extends "base.html" %}

{% block content %}
<div class="formal-card" style="margin-bottom: 2rem;">
    <h2 id="form-title" style="border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">Add New Check</h2>
    <form id="config-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <input type="hidden" id="c_id">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="c_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="c_category" class="form-control" required>
                <!-- populated by JS -->
            </select>
        </div>
        <div class="form-group">
            <label>Dashboard</label>
            <select id="c_dashboard" class="form-control" required>
                <option value="US SOD">US SOD</option>
                <option value="SLIM HC">SLIM HC</option>
            </select>
        </div>
        <div class="form-group" style="grid-column: span 2;">
            <label>Description</label>
            <input type="text" id="c_description" class="form-control" placeholder="Brief description of what this check does">
        </div>
        <div class="form-group" id="group_os_type">
            <label id="label_os_type">OS Type</label>
            <select id="c_os_type" class="form-control" required>
                <option value="linux">Linux</option>
                <option value="windows">Windows</option>
            </select>
        </div>
        <div class="form-group" id="group_host">
            <label id="label_host">Host</label>
            <input type="text" id="c_host" class="form-control" value="localhost" required>
        </div>
        <div class="form-group" id="group_target">
            <label id="label_target">Target Path (Log file or Process name)</label>
            <input type="text" id="c_target" class="form-control">
        </div>
        <div class="form-group" id="group_pattern">
            <label id="label_pattern">Search Pattern (for Logs)</label>
            <input type="text" id="c_pattern" class="form-control">
        </div>
        <div class="form-group" id="group_ssh_user">
            <label id="label_ssh_user">SSH User (for remote)</label>
            <input type="text" id="c_ssh_user" class="form-control">
        </div>
        <div class="form-group" id="group_ssh_key">
            <label id="label_ssh_key">SSH Key Path (Linux remote)</label>
            <input type="text" id="c_ssh_key" class="form-control" placeholder="~/.ssh/id_rsa">
        </div>
        <div class="form-group" id="group_password" style="display: none;">
            <label id="label_password">Password (Windows remote)</label>
            <input type="password" id="c_password" class="form-control" placeholder="Leave blank to keep existing">
        </div>
        
        <div class="form-group" style="grid-column: span 2; display: flex; gap: 1rem; align-items: center; background: #f9fafb; padding: 1rem; border-radius: 4px; border: 1px solid var(--card-border);">
            <input type="checkbox" id="c_scheduled" style="width: 1.25rem; height: 1.25rem; cursor: pointer;">
            <label style="margin:0; font-weight: 600;">Enable Scheduling</label>
        </div>
        
        <div class="form-group" id="schedule_options" style="grid-column: span 2; display: none; background: #ffffff; padding: 1rem; border: 1px solid var(--card-border); border-radius: 4px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Schedule Type</label>
                    <select id="c_schedule_type" class="form-control">
                        <option value="hourly">Hourly</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="custom_cron">Custom</option>
                    </select>
                </div>
                <div id="granular_options" style="display: flex; gap: 1rem; align-items: flex-end;">
                    <div style="flex: 1;">
                        <label>Execute at Hour (0-23)</label>
                        <input type="number" id="c_sched_hour" class="form-control" min="0" max="23" value="0">
                    </div>
                    <div style="flex: 1;">
                        <label>Days to run</label>
                        <select id="c_sched_days" class="form-control">
                            <option value="*">Everyday</option>
                            <option value="mon-fri">Weekdays (Mon-Fri)</option>
                            <option value="sat,sun">Weekends</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group" style="grid-column: span 2; padding-top: 1rem; border-top: 1px solid var(--card-border); text-align: right;">
            <button type="button" class="btn" id="btn-test-connection" style="margin-right: 1rem; background-color: #6b7280; color: white;">Test Connection</button>
            <button type="button" class="btn btn-danger" id="btn-cancel-edit" style="display:none; margin-right: 1rem;">Cancel Edit</button>
            <button type="submit" class="btn btn-primary" id="btn-save" style="padding: 0.6rem 1.5rem;">Save Check</button>
        </div>
    </form>
</div>

<div class="formal-card">
    <h2 style="border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">Configured Checks</h2>
    <div class="table-responsive">
        <table id="checks-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>OS</th>
                    <th>Category</th>
                    <th>Host</th>
                    <th>Target</th>
                    <th>Schedule</th>
                    <th style="text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- populated by js -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
