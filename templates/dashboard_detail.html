{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
        <h2 style="font-size: 2rem; color: #111827; margin: 0;">{{ dashboard_name }} Dashboard</h2>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Detailed view of all checks in this dashboard.</p>
    </div>
    <div style="display: flex; gap: 1rem;">
        <button class="btn btn-primary" onclick="sendEmailReport('{{ dashboard_name }}')">Send Email Report</button>
        <a href="/" class="btn btn-primary" style="text-decoration: none; background: var(--text-secondary);">&larr; Back to Home</a>
    </div>
</div>

<div class="dashboard-grid" id="detail-grid">
    <!-- Detailed check cards will be injected here via JS -->
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const dbName = "{{ dashboard_name }}";
    
    try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        const grid = document.getElementById('detail-grid');
        grid.innerHTML = '';
        
        const dbChecks = data.checks.filter(c => c.dashboard_name === dbName);
        
        if(dbChecks.length === 0) {
            grid.innerHTML = `<div class="formal-card"><p>No checks found for this dashboard.</p></div>`;
            return;
        }
        
        dbChecks.forEach(check => {
            const card = document.createElement('div');
            card.className = `formal-card bg-${check.status}`;
            card.style.marginBottom = '0';
            
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                    <h3 style="margin: 0; font-size: 1.25rem; color: #111827;">${check.name}</h3>
                    <span class="status-badge ${check.status}">${check.status}</span>
                </div>
                <p style="font-size: 0.95rem; color: var(--text-primary); margin-bottom: 1rem;">
                    <strong>Description:</strong> ${check.description || 'No description provided.'}
                </p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-secondary);">
                    <div><strong>Host:</strong> ${check.host}</div>
                    <div><strong>Category:</strong> ${check.category}</div>
                    <div><strong>Last Run:</strong> ${check.last_run ? new Date(check.last_run).toLocaleString() : 'Never'}</div>
                </div>
                
                <h4 style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase;">Latest Output:</h4>
                <div class="log-box">${check.message || 'No details available.'}</div>
                
                <div style="margin-top: 1.25rem; text-align: right; border-top: 1px solid var(--card-border); padding-top: 1rem;">
                    <button class="btn btn-primary" onclick="runCheckManual(${check.id})">Run Check Now</button>
                </div>
            `;
            grid.appendChild(card);
        });
        
    } catch (e) {
        console.error("Failed to load dashboard detail data", e);
    }
});

// Reuse the run check function
async function runCheckManual(checkId) {
    if(!confirm("Are you sure you want to run this check manually?")) return;
    try {
        const res = await fetch(`/api/checks/${checkId}/run`, { method: 'POST' });
        const data = await res.json();
        alert(`Check Completed.\nStatus: ${data.status}\nMessage: ${data.message}`);
        location.reload(); // Reload the page to see updated results
    } catch(e) {
        alert("Failed to run check.");
    }
}
</script>
{% endblock %}
